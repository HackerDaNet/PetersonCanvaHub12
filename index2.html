<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de jogos</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style2.css">
</head>
<body>

    <section>
        <h1>Cadastro de jogos</h1>

        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Digite o nome do jogo">

        <label>Preço:</label>
        <input type="number" id="preco" placeholder="Digite o preço do jogo">

        <label>Gênero:</label>
        <input type="text" id="genero" placeholder="Digite o gênero do jogo">

        <label>Data de Entrada:</label>
        <input type="date" id="data_entrada">

        <label>Data de Saída:</label>
        <input type="date" id="data_saida">

        <br>

        <article>
            <button onclick="listarJogos()">Listar</button>
            <button onclick="cadastrarJogo()">Cadastrar</button>
        </article>

        <hr>

        <ul id="lista"></ul>

        <script src="script2.js"></script>
    </section>
    

</body>
</html>
